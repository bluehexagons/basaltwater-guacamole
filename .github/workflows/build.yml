name: Guacamole binaries

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check builder
        run: python3 -m unittest discover -s tests
      - name: Build and verify runtime
        env:
          GUACAMOLE_BUILD_COMMIT: ${{ github.sha }}
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python3 build.py container-build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: guacamole-trixie-${{ matrix.architecture }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate release tag
        run: |
          python3 -c 'import json, os; assert os.environ["GITHUB_REF_NAME"] == "v" + json.load(open("release.json"))["build_version"]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: guacamole-trixie-*
          merge-multiple: true
          path: dist
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/*.sha256 --verify-tag \
            --title "Basaltwater Guacamole $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
